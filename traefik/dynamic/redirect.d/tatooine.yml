http:
  routers:
    tatooine-nas:
      entrypoints:
        - websecure
      rule: "Host(`nas.tatooine.patz.app`)"
      tls:
        certResolver: patz.app
      middlewares:
        - keycloak@file
      service: tatooine-nas

  services:
    tatooine-nas:
      loadBalancer:
        servers:
          - url: https://192.168.1.4:443
        serversTransport: trust-internal-tls
