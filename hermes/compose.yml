networks:
  traefik:
    name: traefik
    external: true

secrets:
  vaultwarden_private_api_key:
    file: /mnt/ssd-1tb/docker-secrets/hermes/vaultwarden_private_api_key

services:
  hermes:
    build:
      context: .
      args:
        HERMES_TAG: ${HERMES_TAG:-latest}
    restart: unless-stopped
    command: /usr/local/bin/entrypoint.sh
    environment:
      - HERMES_UID=10000
      - HERMES_GID=10000
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_PUBLIC_URL=https://hermes.patz.app
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=admin
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
      - BITWARDENCLI_APPDATA_DIR=/run/hermes-bw
    secrets:
      - vaultwarden_private_api_key
    tmpfs:
      - /run/hermes-bw:mode=0700,uid=10000,gid=10000
    volumes:
      - /mnt/ssd-1tb/docker/hermes:/opt/data
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.hermes.entrypoints=websecure
      - traefik.http.routers.hermes.rule=Host(`hermes.patz.app`)
      - traefik.http.routers.hermes.tls.certresolver=patz.app
      - traefik.http.services.hermes.loadbalancer.server.port=9119
